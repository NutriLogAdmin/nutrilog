name: NutriLog CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-server:
    name: Build y test del servidor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias del servidor
        working-directory: server
        run: npm ci

      - name: Comprobar que el servidor arranca
        working-directory: server
        run: node -e "require('./src/database.js'); console.log('Base de datos OK')"
        env:
          NODE_ENV: test

  build-client:
    name: Build del cliente React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias del cliente
        working-directory: client
        run: npm ci

      - name: Build de producción
        working-directory: client
        run: npm run build

      - name: Guardar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrilog-client-build
          path: client/dist